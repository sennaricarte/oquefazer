# Site estático Astro — deploy via Workers (assets).
name = "oquefazer"
compatibility_date = "2024-09-23"

# Domínios customizados: configure só no painel (Domínios e rotas).
# Não declare routes aqui — o deploy via Git falha ao recriar DNS/domains/records.
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
